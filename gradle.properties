org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# Kotlin and AGP need more than Gradle's default 512 MB heap.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# The release version of the apps, and nothing else's (docs/adr/0019-release-builds.md). A release
# raises both: versionName as MAJOR.MINOR.PATCH, versionCode by one. F-Droid reads them here.
jotter.versionName=0.1.0
jotter.versionCode=1
