# Overrides on top of detekt's default configuration (buildUponDefaultConfig = true).
# Only list rules here whose default we deliberately change.

comments:
  # docs/PLAN.md §8: KDoc on every public class, function and property.
  UndocumentedPublicClass:
    active: true
  UndocumentedPublicFunction:
    active: true
  UndocumentedPublicProperty:
    active: true

naming:
  # A @Composable that emits UI is named like a class, by Compose's convention.
  FunctionNaming:
    ignoreAnnotated: ["Composable"]

style:
  # Matches .editorconfig, so detekt and ktlint agree.
  MaxLineLength:
    maxLineLength: 100
