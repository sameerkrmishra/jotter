[versions]
# AGP 9.4 requires Gradle 9.x and provides the Android-KMP library plugin (jotter.kmp-library).
agp = "9.4.1"
# sqlite-bundled 2.7.1 ships SQLite 3.50.1 on Android, the JVM and linuxX64 (ADR-0002, ADR-0006).
androidx-sqlite = "2.7.1"
androidx-test-runner = "1.7.0"
atomicfu = "0.33.0"
clikt = "5.1.0"
# Compose Multiplatform 1.12.x supports Kotlin 2.4.x (docs/spikes/0002-desktop-packaging.md). The
# Compose compiler plugin is released with Kotlin, so it uses version.ref = "kotlin".
compose-multiplatform = "1.12.2"
# Material3 is versioned apart from Compose Multiplatform since 1.10: upgrades are two bumps.
compose-material3 = "1.9.0"
kotlin = "2.4.21"
# detekt 1.23.x embeds Kotlin 2.0.21 and cannot analyse Kotlin 2.1+ sources. 2.0.0-alpha.6
# embeds Kotlin 2.4.10, the only detekt release that matches our compiler.
# TODO: move to the stable detekt 2.0 once it is released.
detekt = "2.0.0-alpha.6"
kotest = "6.2.6"
kotlinx-coroutines = "1.11.0"
# Publishes linuxX64 variants (ADR-0006).
kotlinx-serialization = "1.12.0"
kover = "0.9.11"
ktlint-gradle = "14.2.0"
okio = "3.18.2"
sqldelight = "2.4.1"

[libraries]
# Gradle plugins, consumed by build-logic/ as regular dependencies.
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
compose-compiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose-multiplatform" }
detekt-gradlePlugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kover-gradlePlugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
ktlint-gradlePlugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }

# Libraries.
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "androidx-sqlite" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidx-sqlite" }
atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
clikt-core = { module = "com.github.ajalt.clikt:clikt-core", version.ref = "clikt" }
compose-desktop-linux-x64 = { module = "org.jetbrains.compose.desktop:desktop-jvm-linux-x64", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
# Dispatchers.Main on the desktop.
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
sqldelight-coroutines-extensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
# The SQL dialect of core/storage's .sq files. Both bundled SQLite builds are 3.50 (ADR-0002).
sqldelight-dialect-sqlite344 = { module = "app.cash.sqldelight:sqlite-3-44-dialect", version.ref = "sqldelight" }
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }

# Test libraries.
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
# Clikt's test support. It is not in clikt-core, and it brings the Mordant terminal library.
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
# runComposeUiTest.
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
# runTest, to call Kotest's suspending property checks from kotlin.test.
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }

[plugins]
# Generates the serializers of @Serializable classes; versioned with the compiler.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Generates core/storage's database code from its .sq files.
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
