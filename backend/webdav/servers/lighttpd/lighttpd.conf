# lighttpd with mod_webdav, for the tests against real servers (see ../../README.md).
# Listens on loopback only, on the port in the environment variable PORT.
server.modules = ("mod_auth", "mod_authn_file", "mod_webdav")
server.document-root = "/srv/dav"
server.bind = "127.0.0.1"
server.port = env.PORT
server.errorlog = "/dev/stderr"

webdav.activate = "enable"
webdav.is-readonly = "disable"
webdav.sqlite-db-name = "/var/lib/lighttpd/webdav.sqlite"

auth.backend = "plain"
auth.backend.plain.userfile = "/etc/lighttpd/users"
auth.require = ("" => ("method" => "basic", "realm" => "jotter-test", "require" => "valid-user"))
