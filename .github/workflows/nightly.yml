name: Nightly

# The sync simulator over far more seeds than `check` can afford (core/sync/README.md). A failure
# names the seed that replays it, and opens an issue so that it cannot pass unseen.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    name: simulate
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # Above the range `check` runs, and a different stretch every night: the run number moves the
      # start, so the nights add up to new seeds.
      - name: Run 50000 seeds
        env:
          RUN: ${{ github.run_number }}
        run: core/sync/scripts/simulate.sh "$((100000 + RUN * 50000))" 50000

      - if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulator-results
          path: core/sync/build/test-results/jvmTest/
          retention-days: 14

  report:
    name: report
    needs: simulate
    # Not failure(): a run that hits its timeout counts as cancelled, and must not pass unseen.
    if: always() && needs.simulate.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "Nightly sync simulation failed" \
            --body "The nightly simulator run failed: $RUN_URL. Its test results name the seed."
