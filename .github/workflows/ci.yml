name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs share a group per ref so new pushes cancel superseded runs. Other events get
  # a group per commit, because GitHub replaces a pending run in the same group even
  # without cancel-in-progress, which would skip pushes to main.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    # Measured 2026-11-03 at 21 to 32 minutes, most of it compiling and linking the native tests.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # JDK 21 matches the daemon JVM criteria, so Gradle needs no toolchain download.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle state and validates the wrapper jar checksum (on by default).
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Open-source cache on GitHub Actions cache, not the default commercial provider
          # with its own terms of use.
          cache-provider: basic

      # Kotlin/Native fetches its LLVM and sysroot (about 1 GB) from JetBrains on first use, outside
      # Gradle's cache. They depend only on the Kotlin version, so that is the cache key. Only main
      # saves the cache, so pull requests cannot fill the cache quota and evict the Gradle cache.
      - id: kotlin
        run: |
          version=$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: konan
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan/dependencies
          key: konan-${{ runner.os }}-kotlin-${{ steps.kotlin.outputs.version }}

      # The runner image ships an Android SDK at $ANDROID_HOME with its licenses
      # accepted, so AGP downloads any missing platform or build-tools itself.
      - run: ./gradlew check

      - if: github.ref == 'refs/heads/main' && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan/dependencies
          key: ${{ steps.konan.outputs.cache-primary-key }}

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: '**/build/reports/**'
          if-no-files-found: ignore
          retention-days: 7

  # The simulator over seeds 1 to 3000 on the JVM, beside `check`, which runs only a sample
  # (core/sync/README.md). The script fails unless the report says that exactly this range ran,
  # and the range is a task input, so no cached result can answer for it.
  simulate:
    name: simulate
    runs-on: ubuntu-latest
    # Measured 2026-11-03: 8 minutes, the 3000 seeds 4 m 40 s on the runner's 4 threads.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - run: core/sync/scripts/simulate.sh 1 3000

      - if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulator-results
          path: core/sync/build/test-results/jvmTest/
          retention-days: 7

  # The shared modules' tests on Android emulators, at minSdk and compileSdk (PLAN.md §8): the
  # bundled SQLite, the Android file system and network stack, which the JVM jobs cannot reach.
  # On every pull request: the repository is public, so runner minutes cost nothing, and both
  # API levels together finish well before `check`, so a pull request waits no longer.
  android-device:
    name: android-device (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    # Measured 2026-11-03 on the first run: 11.5 minutes on API 26 and 8 on API 36, of which
    # building the test APKs took 3.5 to 5 and the emulator with the tests 4.5 to 6.5.
    timeout-minutes: 25
    strategy:
      # Both API levels report, even when one fails.
      fail-fast: false
      matrix:
        api-level: [26, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # The emulator needs hardware acceleration, and the runner's user may not open /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Builds the test APKs before the emulator starts, so that its time goes to the tests.
      # The shared modules' test APKs, and the Android app with its tests.
      - run: ./gradlew assembleAndroidDeviceTest :app:android:assembleDebugAndroidTest

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          cores: 3
          ram-size: 3072M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # connectedAndroidDeviceTest and :app:android:connectedDebugAndroidTest, with --continue
          # so that every module reports, not only the first that fails. A module whose tests did
          # not run at all, because an adb call of the test runner failed, runs once more; see
          # the script. app/android's own device tests took about 1 minute per API level on a
          # local emulator.
          script: .github/scripts/device-tests.sh

      # A runner argument that filtered out every test of a module would pass silently, and so would
      # a module whose test APK the runner never installed, even after the retry.
      - if: ${{ !cancelled() }}
        run: .github/scripts/device-test-results.sh

      - if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-test-results-api-${{ matrix.api-level }}
          path: |
            **/build/outputs/androidTest-results/
            **/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7

  # backend:webdav against real WebDAV servers in containers (lighttpd, Apache, rclone), beside
  # `check`, which tests it against an in-memory server only (backend/webdav/README.md). The runner
  # has Docker. The script pins the images by digest and fails unless every live test class ran.
  webdav:
    name: webdav
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # The same Kotlin/Native toolchain cache as `check`, which alone saves it.
      - id: kotlin
        run: |
          version=$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan/dependencies
          key: konan-${{ runner.os }}-kotlin-${{ steps.kotlin.outputs.version }}

      - run: backend/webdav/scripts/live-test.sh

      - if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webdav-results
          path: |
            backend/webdav/build/test-results/
            backend/webdav/build/live-test/
          retention-days: 7
