name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs share a group per ref so new pushes cancel superseded runs. Other events get
  # a group per commit, because GitHub replaces a pending run in the same group even
  # without cancel-in-progress, which would skip pushes to main.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # JDK 21 matches the daemon JVM criteria, so Gradle needs no toolchain download.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle state and validates the wrapper jar checksum (on by default).
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Open-source cache on GitHub Actions cache, not the default commercial provider
          # with its own terms of use.
          cache-provider: basic

      # Kotlin/Native fetches its LLVM and sysroot (about 1 GB) from JetBrains on first use, outside
      # Gradle's cache. They depend only on the Kotlin version, which lives in the version catalog.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan/dependencies
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      # The runner image ships an Android SDK at $ANDROID_HOME with its licenses
      # accepted, so AGP downloads any missing platform or build-tools itself.
      - run: ./gradlew check

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: '**/build/reports/**'
          if-no-files-found: ignore
          retention-days: 7
